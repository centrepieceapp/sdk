[package]
name = "centrepiece-extension"
# Follows the extension API: 0.6.x speaks `api = "0.6"`, the version of the
# WIT package in wit/extension.wit.
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
description = "Write extensions for Centrepiece, compiled to WebAssembly components"
license = "MIT"
repository = "https://github.com/centrepieceapp/sdk"

[dependencies]
wit-bindgen = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
